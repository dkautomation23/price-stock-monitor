name: Feature request
description: Ask for something the tool does not do yet
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the README first — this watches pages you configure by CSS
        selector; it does not discover products on its own and it does not
        render JavaScript-heavy pages (no headless browser). If your request
        needs either of those, say what problem it solves.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to get done?
      description: The situation, not the feature. The feature you are asking for may not be the right answer.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: What you run now, and where it falls short.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Anything this should not break
