# Copy to products.yaml and edit for your own product pages.
# The defaults point at books.toscrape.com — a public sandbox built for
# scraping practice — so the tool runs out of the box with no setup.

settings:
  timeout: 20          # seconds per request
  retries: 2           # extra attempts on failure (exponential backoff)
  backoff: 1.0         # base backoff seconds
  request_delay: 1.0   # pause between products (be polite)
  # webhook_url: "https://hooks.slack.com/services/XXX/YYY/ZZZ"  # optional: Slack/Discord/generic {"text": ...}

products:
  - name: "A Light in the Attic"
    url: "https://books.toscrape.com/catalogue/a-light-in-the-attic_1000/index.html"
    price_selector: "p.price_color"
    stock_selector: "p.instock.availability"
    in_stock_text: "in stock"

  - name: "Tipping the Velvet"
    url: "https://books.toscrape.com/catalogue/tipping-the-velvet_999/index.html"
    price_selector: "p.price_color"
    stock_selector: "p.instock.availability"
    in_stock_text: "in stock"
